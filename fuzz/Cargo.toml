[package]
name = "parse-net-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Oracles for the differential targets only (dev/PLAN.md section 15). They
# never reach parse-net's own dependency tree.
httpdate = "1"
mime = "0.3"
sfv = "0.16"

[dependencies.parse-net]
path = ".."
features = ["alloc"]

# Keeps this crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "text_quoted"
path = "fuzz_targets/text_quoted.rs"
test = false
doc = false
bench = false

